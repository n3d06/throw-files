<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>throw-files</title>
    <meta
      name="description"
      content="Send files straight from one browser to another. Direct when possible, relayed in memory otherwise, never written to a server, no account needed."
    />
    <link rel="canonical" href="https://tf.n3d.site/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1a73e8" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="msapplication-TileColor" content="#1a73e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="throw-files" />
    <meta name="theme-color" content="#1f1f23" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f8fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved light/dark choice before first paint (see src/utils/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem("throwmyfile-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          var c = t === "dark" ? "#1f1f23" : "#f8f8fa";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c;
          });
        }
      } catch (e) {}
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="throw-files" />
    <meta property="og:url" content="https://tf.n3d.site/" />
    <meta property="og:title" content="throw-files" />
    <meta
      property="og:description"
      content="Send files straight from one browser to another. Direct when possible, relayed in memory otherwise, never written to a server."
    />
    <meta property="og:image" content="https://tf.n3d.site/og_image.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="420" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tf.n3d.site/" />
    <meta name="twitter:title" content="throw-files" />
    <meta
      name="twitter:description"
      content="Send files straight from one browser to another. Direct when possible, relayed in memory otherwise, never written to a server."
    />
    <meta
      name="twitter:image"
      content="https://tf.n3d.site/og_image.png"
    />

  </head>
  <body>
    <noscript
      style="
        display: block;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
      "
      >ThrowMyFile needs JavaScript to move files between browsers. Please enable
      it and reload.</noscript
    >
    <div id="root"></div>
  </body>
</html>
