name            = "throw-files"
main            = "worker/index.ts"
compatibility_date = "2025-06-01"
account_id      = "f8944e495ca1b0ceb3548df6160e6b3a"

[assets]
directory = "./client/build"
binding = "ASSETS"
# Worker first so WebSocket upgrades on "/" reach the Durable Object.
run_worker_first = true
not_found_handling = "single-page-application"

[durable_objects]
bindings = [
  { name = "THROW_FILES_CHANNEL", class_name = "ThrowFilesChannel" }
]

[[migrations]]
tag               = "v1"
new_sqlite_classes = ["ThrowFilesContainer"]

[[migrations]]
tag         = "v2"
new_sqlite_classes = ["ThrowFilesChannel"]
deleted_classes = ["ThrowFilesContainer"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# Invocation logs record the request URL, which contains the channel code.
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
